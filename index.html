<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chargie Field Ops // Safety Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1.5rem; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        #menuDrawer { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .drawer-open { transform: translateX(0) !important; }
        .burger-bun { background: #D2B48C; height: 4px; width: 28px; border-radius: 4px; }
        .burger-lettuce { background: #22C55E; height: 3px; width: 28px; border-radius: 4px; }
        .burger-meat { background: #5C4033; height: 4px; width: 28px; border-radius: 4px; }
        details summary::-webkit-details-marker { display:none; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-white text-[#002855] min-h-screen relative overflow-x-hidden">

    <div id="overlay" class="fixed inset-0 bg-slate-900/20 opacity-0 pointer-events-none transition-opacity z-[60]" onclick="toggleMenu()"></div>
    
    <div id="menuDrawer" class="fixed top-0 left-0 h-full w-80 bg-white shadow-2xl z-[70] -translate-x-full p-8 border-r border-slate-100 overflow-y-auto">
        <div class="flex justify-between items-center mb-12 text-orange-600 font-black italic uppercase tracking-tighter">
            <h2>Archive Library</h2>
            <button onclick="toggleMenu()" class="text-slate-400 text-2xl">✕</button>
        </div>
        
        <div class="space-y-6">
            <details class="group" open>
                <summary class="flex justify-between items-center font-black text-[10px] tracking-[0.3em] uppercase text-slate-300 cursor-pointer mb-4 italic">Job Site Safety <span class="group-open:rotate-180 transition-transform">▾</span></summary>
                <nav id="archive-JobSite" class="space-y-3 pl-4 border-l-2 border-slate-50"></nav>
            </details>
            <details class="group">
                <summary class="flex justify-between items-center font-black text-[10px] tracking-[0.3em] uppercase text-slate-300 cursor-pointer mb-4 italic">Driver Safety <span class="group-open:rotate-180 transition-transform">▾</span></summary>
                <nav id="archive-Driver" class="space-y-3 pl-4 border-l-2 border-slate-50"></nav>
            </details>
            <details class="group">
                <summary class="flex justify-between items-center font-black text-[10px] tracking-[0.3em] uppercase text-slate-300 cursor-pointer mb-4 italic">Safety Docs <span class="group-open:rotate-180 transition-transform">▾</span></summary>
                <nav id="archive-Doc" class="space-y-3 pl-4 border-l-2 border-slate-50"></nav>
            </details>
        </div>
    </div>

    <header class="bg-white border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center gap-6">
                <button onclick="toggleMenu()" class="flex flex-col gap-1 p-2 hover:bg-slate-50 rounded-lg">
                    <span class="burger-bun"></span><span class="burger-lettuce"></span><span class="burger-meat"></span><span class="burger-bun"></span>
                </button>
                <img src="https://raw.githubusercontent.com/manfredoaguilar-cpu/Safety/main/Chargie%20Logo%201.png" alt="Chargie" class="h-6 w-auto">
            </div>
            <div id="user-status" class="hidden md:flex items-center gap-2 px-4 py-2 bg-slate-50 rounded-full text-[10px] font-black border border-slate-100 text-slate-400 uppercase tracking-widest">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span><span id="display-name">Portal Active</span>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-12 text-center">
        <h1 id="moduleTitle" class="text-5xl md:text-7xl font-black mb-4 tracking-tighter uppercase text-[#002855]">Loading...</h1>
        <div class="bg-white p-3 md:p-5 rounded-[2.5rem] shadow-2xl border border-slate-100 mb-16">
            <div class="video-container">
                <iframe id="heroVideo" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>

        <div class="max-w-2xl mx-auto">
            <section id="language-screen" class="bg-white rounded-3xl p-8 border border-slate-100 fade-in shadow-sm">
                <h3 class="text-xl font-black text-[#002855] mb-8 uppercase italic">Select Language</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button onclick="setLanguage('en')" class="bg-[#002855] text-white font-black py-5 rounded-2xl uppercase text-xs tracking-widest hover:bg-orange-600 transition-all">English</button>
                    <button onclick="setLanguage('es')" class="bg-[#002855] text-white font-black py-5 rounded-2xl uppercase text-xs tracking-widest hover:bg-orange-600 transition-all">Español</button>
                </div>
            </section>

            <section id="start-screen" class="hidden bg-white rounded-3xl p-8 border border-slate-100 text-left fade-in">
                <a id="download-btn" href="#" target="_blank" class="block w-full mb-8 bg-orange-100 text-orange-600 font-black py-5 rounded-2xl border-2 border-orange-200 text-center uppercase text-[10px] tracking-widest">Download Study Guide (PDF)</a>
                <div class="space-y-4">
                    <input type="text" id="userName" placeholder="Full Name" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-sm outline-none">
                    <input type="email" id="userEmail" placeholder="Chargie Email" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-sm outline-none">
                    <div class="flex items-center gap-4 bg-slate-50 p-6 rounded-2xl border border-slate-100">
                        <input id="ack-checkbox" type="checkbox" class="h-5 w-5 rounded border-slate-300 text-orange-600">
                        <label id="ack-label" for="ack-checkbox" class="text-slate-500 text-[11px] font-bold leading-tight"></label>
                    </div>
                    <button onclick="startQuiz()" id="start-btn" class="w-full bg-[#002855] text-white font-black py-6 rounded-2xl uppercase text-xs tracking-widest hover:bg-orange-600 transition-colors"></button>
                </div>
            </section>

            <section id="quiz-container" class="hidden bg-white rounded-3xl p-8 border border-slate-100 text-left fade-in"></section>
        </div>
    </main>

    <script>
        // REPLACE WITH YOUR NEW WEB APP URL
        const scriptURL = 'https://script.google.com/macros/s/AKfycby9583-__gQyu2cHTPG9aymOMbT-Xahm6jC_ELoP3fQe_Y-NsUbnb1747AO5xYmSG2aFg/exec';
        const urlParams = new URLSearchParams(window.location.search);
        let uuid = urlParams.get('id');
        let activeQuizData = [];
        let currentLang = 'en';
        let currentModTitle = "";

        const msgs = {
            en: { start: "Begin Evaluation", ack: "I confirm I have watched the video and reviewed the guide.", fields: "Name and Email required.", ackErr: "Acknowledge before starting.", next: "Next Challenge →", final: "Finalize Sync", correct: "// Correct", retry: "// Re-evaluate" },
            es: { start: "Iniciar Evaluación", ack: "Confirmo que he visto el video y revisado la guía.", fields: "Nombre y Correo requeridos.", ackErr: "Debe confirmar antes de iniciar.", next: "Siguiente →", final: "Finalizar", correct: "// Correcto", retry: "// Re-evaluar" }
        };

        function toggleMenu() { 
            document.getElementById('menuDrawer').classList.toggle('drawer-open'); 
            document.getElementById('overlay').classList.toggle('opacity-0'); 
            document.getElementById('overlay').classList.toggle('pointer-events-none'); 
        }

        function setLanguage(l) { 
            currentLang = l;
            document.getElementById('language-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('download-btn').href = l === 'en' ? window.guideEN : window.guideES;
            document.getElementById('ack-label').textContent = msgs[l].ack;
            document.getElementById('start-btn').textContent = msgs[l].start;
            // SWITCH QUIZ DATA HERE
            activeQuizData = l === 'en' ? window.quizEN : window.quizES;
        }

        function startQuiz() {
            if (!document.getElementById('userName').value || !document.getElementById('userEmail').value) return alert(msgs[currentLang].fields);
            if (!document.getElementById('ack-checkbox').checked) return alert(msgs[currentLang].ackErr);
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            showQuestion(0);
        }

        function showQuestion(idx) {
            const q = activeQuizData[idx];
            const container = document.getElementById('quiz-container');
            container.innerHTML = `
                <div class="mb-10 text-center">
                    <span class="inline-block px-3 py-1 bg-slate-50 text-[#002855] text-[9px] font-black rounded-full mb-4 uppercase tracking-[0.2em] italic border border-slate-100">Step ${idx+1} / ${activeQuizData.length}</span>
                    <h2 class="text-2xl font-black text-[#002855] tracking-tight leading-none">${q.q}</h2>
                </div>
                <div id="answers" class="space-y-3"></div>
                <div id="feedback" class="mt-8 min-h-[100px]"></div>
            `;
            q.a.forEach((opt, oIdx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-white border border-slate-100 p-5 rounded-2xl font-bold text-sm text-slate-500 hover:border-orange-500 hover:text-[#002855] transition-all";
                btn.innerHTML = opt;
                btn.onclick = () => {
                    const f = document.getElementById('feedback');
                    const btns = document.getElementById('answers').children;
                    for(let b of btns) b.disabled = true;

                    if (oIdx === q.correct) {
                        f.innerHTML = `
                            <div class="p-5 bg-green-50 border border-green-200 rounded-xl fade-in">
                                <p class="text-green-700 font-black text-[10px] uppercase tracking-widest mb-1 italic">${msgs[currentLang].correct}</p>
                                <p class="text-slate-600 text-xs font-bold mb-4">${q.f}</p>
                                <button onclick="${idx < activeQuizData.length - 1 ? `showQuestion(${idx+1})` : `complete()`}" class="w-full bg-[#002855] text-white py-4 rounded-xl font-black uppercase text-xs tracking-widest">
                                    ${idx < activeQuizData.length - 1 ? msgs[currentLang].next : msgs[currentLang].final}
                                </button>
                            </div>`;
                    } else {
                        f.innerHTML = `
                            <div class="p-5 bg-red-50 border border-red-200 rounded-xl fade-in">
                                <p class="text-red-700 font-black text-[10px] uppercase tracking-widest mb-1 italic">${msgs[currentLang].retry}</p>
                                <p class="text-slate-600 text-xs font-bold mb-4">${q.f}</p>
                                <button onclick="showQuestion(${idx})" class="w-full bg-slate-100 text-slate-400 py-3 rounded-xl font-black uppercase text-xs italic">Try Again</button>
                            </div>`;
                    }
                };
                document.getElementById('answers').appendChild(btn);
            });
        }

        function complete() {
            document.getElementById('quiz-container').innerHTML = `
                <div class="text-center py-12 fade-in">
                    <h2 class="text-4xl font-black uppercase tracking-tighter">Verified</h2>
                    <p class="text-slate-400 font-bold uppercase text-[10px] tracking-[0.4em] italic mt-4">
                        ${currentLang === 'en' ? 'Field Ops Compliance Sync Complete' : 'Sincronización de Cumplimiento Completa'}
                    </p>
                </div>`;
            fetch(scriptURL + "?uuid=" + uuid + "&name=" + encodeURIComponent(document.getElementById('userName').value) + "&email=" + encodeURIComponent(document.getElementById('userEmail').value) + "&lang=" + currentLang + "&modTitle=" + encodeURIComponent(currentModTitle));
        }

        window.onload = () => {
            if (urlParams.has('name')) {
                document.getElementById('userName').value = urlParams.get('name');
                document.getElementById('user-status').classList.remove('hidden');
                document.getElementById('display-name').textContent = 'Welcome, ' + urlParams.get('name');
            }
            if (urlParams.has('email')) document.getElementById('userEmail').value = urlParams.get('email');

            const modID = urlParams.get('module') || "";
            fetch(scriptURL + "?action=getModule&moduleId=" + modID)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('moduleTitle').textContent = data.topic;
                    currentModTitle = data.topic;
                    document.getElementById('heroVideo').src = "https://www.youtube.com/embed/" + data.videoId + "?rel=0";
                    window.guideEN = data.guideEN; 
                    window.guideES = data.guideES; 
                    window.quizEN = data.quizEN; 
                    window.quizES = data.quizES;
                })
                .catch(() => { document.getElementById('moduleTitle').textContent = "Connection Error"; });
            
            fetch(scriptURL + "?action=getArchive")
                .then(r => r.json())
                .then(data => {
                    ["JobSite", "Driver", "Doc"].forEach(cat => document.getElementById(`archive-${cat}`).innerHTML = "");
                    data.forEach(m => {
                        const nav = document.getElementById(`archive-${m.category.replace(/\s+/g, '')}`);
                        if (nav) {
                            const l = document.createElement('a');
                            l.href = `?id=${uuid || ''}&name=${urlParams.get('name') || ''}&email=${urlParams.get('email') || ''}&module=${m.id}`;
                            l.className = "block text-[11px] font-bold text-slate-400 hover:text-orange-600 uppercase tracking-widest pb-1 transition-colors";
                            l.textContent = `Module ${m.id}: ${m.title}`;
                            nav.appendChild(l);
                        }
                    });
                });
        }
    </script>
</body>
</html>
