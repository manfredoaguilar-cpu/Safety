<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chargie Field Ops // Safety Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1.5rem; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        #menuDrawer { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .drawer-open { transform: translateX(0) !important; }
        .burger-bun { background: #D2B48C; height: 4px; width: 28px; border-radius: 4px; }
        .burger-lettuce { background: #22C55E; height: 3px; width: 28px; border-radius: 4px; }
        .burger-meat { background: #5C4033; height: 4px; width: 28px; border-radius: 4px; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-white text-[#002855] min-h-screen relative overflow-x-hidden">

    <div id="overlay" class="fixed inset-0 bg-slate-900/20 opacity-0 pointer-events-none transition-opacity z-[60]" onclick="toggleMenu()"></div>
    
    <div id="menuDrawer" class="fixed top-0 left-0 h-full w-80 bg-white shadow-2xl z-[70] -translate-x-full p-8 border-r border-slate-100 overflow-y-auto">
        <div class="flex justify-between items-center mb-12">
            <h2 class="text-xl font-black tracking-tighter uppercase italic text-orange-600">Library</h2>
            <button onclick="toggleMenu()" class="text-slate-400 hover:text-orange-600 text-2xl">✕</button>
        </div>
        <nav id="archiveList" class="space-y-4"></nav>
    </div>

    <header class="bg-white border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center gap-6">
                <button onclick="toggleMenu()" class="flex flex-col gap-1 p-2 hover:bg-slate-50 rounded-lg">
                    <span class="burger-bun"></span><span class="burger-lettuce"></span><span class="burger-meat"></span><span class="burger-bun"></span>
                </button>
                <img src="https://raw.githubusercontent.com/manfredoaguilar-cpu/Safety/main/Chargie%20Logo%201.png" alt="Chargie" class="h-6 w-auto">
            </div>
            <div id="user-status" class="hidden md:flex items-center gap-2 px-4 py-2 bg-slate-50 rounded-full text-[10px] font-black uppercase tracking-widest border border-slate-100 text-slate-400">
                <span class="w-2 h-2 bg-green-500 rounded-full"></span><span id="display-name">Technician Portal</span>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-12 text-center">
        <h2 id="moduleTitle" class="text-5xl md:text-7xl font-black mb-4 tracking-tighter uppercase leading-none text-[#002855]">Loading...</h2>
        <div class="bg-white p-3 rounded-[2.5rem] shadow-2xl border border-slate-100 mb-16">
            <div class="video-container"><iframe id="heroVideo" src="" frameborder="0" allowfullscreen></iframe></div>
        </div>

        <div class="max-w-2xl mx-auto">
            <section id="language-screen" class="bg-white rounded-3xl p-8 border border-slate-100 fade-in">
                <h3 class="text-xl font-black text-[#002855] mb-8 uppercase italic">Select Language</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button onclick="setLanguage('en')" class="bg-[#002855] text-white font-black py-5 rounded-2xl uppercase text-xs">English</button>
                    <button onclick="setLanguage('es')" class="bg-[#002855] text-white font-black py-5 rounded-2xl uppercase text-xs">Español</button>
                </div>
            </section>

            <section id="start-screen" class="hidden bg-white rounded-3xl p-8 border border-slate-100 text-left fade-in">
                <a id="download-btn" href="#" target="_blank" class="block w-full mb-8 bg-orange-100 text-orange-600 font-black py-5 rounded-2xl border-2 border-orange-200 text-center uppercase text-xs italic">Download Study Guide (PDF)</a>
                <div class="space-y-4">
                    <input type="text" id="userName" placeholder="Full Name" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-sm">
                    <input type="email" id="userEmail" placeholder="Chargie Email" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-sm">
                    <button onclick="startQuiz()" class="w-full bg-[#002855] text-white font-black py-6 rounded-2xl uppercase text-xs tracking-widest">Begin Evaluation</button>
                </div>
            </section>

            <section id="quiz-container" class="hidden bg-white rounded-3xl p-8 border border-slate-100 text-left fade-in"></section>
        </div>
    </main>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyg4-urQ6p27Ig_UmKtqLC5Dr_xmh9A3NDI2FSZri_Voup-VArWV3CK0yFXgt6FU2gV4Q/exec';
        const urlParams = new URLSearchParams(window.location.search);
        let uuid = urlParams.get('id');
        let currentModuleId = urlParams.get('module');
        let quizData = [];
        let currentLang = 'en';

        function toggleMenu() { document.getElementById('menuDrawer').classList.toggle('drawer-open'); document.getElementById('overlay').classList.toggle('opacity-0'); document.getElementById('overlay').classList.toggle('pointer-events-none'); }

        function setLanguage(l) { 
            currentLang = l;
            document.getElementById('language-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('download-btn').href = l === 'en' ? window.guideEN : window.guideES;
        }

        function loadModule(mid) {
            const query = mid ? `&moduleId=${mid}` : '';
            fetch(scriptURL + "?action=getModule" + query).then(r => r.json()).then(data => {
                document.getElementById('moduleTitle').textContent = data.topic;
                document.getElementById('heroVideo').src = "https://www.youtube.com/embed/" + data.videoId;
                window.guideEN = data.guideEN;
                window.guideES = data.guideES;
                quizData = data.quiz;
            });
        }

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            showQuestion(0);
        }

        function showQuestion(idx) {
            const q = quizData[idx];
            const container = document.getElementById('quiz-container');
            container.innerHTML = `<h2 class="text-2xl font-black text-[#002855] mb-8">${idx+1}. ${q.q}</h2><div id="answers" class="space-y-3"></div><div id="feedback" class="mt-8"></div>`;
            q.a.forEach((opt, oIdx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-white border border-slate-100 p-5 rounded-2xl font-bold text-sm text-slate-500 hover:border-orange-500";
                btn.innerHTML = `<span>${opt}</span>`;
                btn.onclick = () => {
                    if (oIdx === q.correct) {
                        document.getElementById('feedback').innerHTML = `<div class="p-4 bg-green-50 text-green-700 rounded-xl font-bold mb-4">${q.f}</div><button onclick="${idx < quizData.length - 1 ? `showQuestion(${idx+1})` : `complete()`}" class="w-full bg-[#002855] text-white py-4 rounded-xl font-black uppercase text-xs">Next →</button>`;
                    } else {
                        document.getElementById('feedback').innerHTML = `<div class="p-4 bg-red-50 text-red-700 rounded-xl font-bold">${q.f}</div>`;
                    }
                };
                document.getElementById('answers').appendChild(btn);
            });
        }

        function complete() {
            document.getElementById('quiz-container').innerHTML = `<div class="text-center py-8"><h2 class="text-4xl font-black uppercase">Verified</h2><p class="text-slate-400 font-bold uppercase text-[10px] tracking-[0.4em] italic mt-4">Field Ops Sync Complete</p></div>`;
            fetch(scriptURL + "?uuid=" + uuid + "&name=" + encodeURIComponent(document.getElementById('userName').value));
        }

        window.onload = () => {
            if (urlParams.has('name')) {
                document.getElementById('userName').value = urlParams.get('name');
                document.getElementById('user-status').classList.remove('hidden');
                document.getElementById('display-name').textContent = 'Welcome, ' + urlParams.get('name');
            }
            if (urlParams.has('email')) document.getElementById('userEmail').value = urlParams.get('email');
            
            loadModule(currentModuleId);
            
            fetch(scriptURL + "?action=getArchive").then(r => r.json()).then(data => {
                const list = document.getElementById('archiveList');
                data.forEach(m => {
                    const link = document.createElement('a');
                    link.href = `?id=${uuid || ''}&name=${urlParams.get('name') || ''}&email=${urlParams.get('email') || ''}&module=${m.id}`;
                    link.className = "block text-xs font-bold text-slate-400 hover:text-orange-600 uppercase tracking-widest";
                    link.textContent = `Module ${m.id}: ${m.title}`;
                    list.appendChild(link);
                });
            });
        }
    </script>
</body>
</html>
