<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chargie Field Ops // Safety Hub</title>

  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://script.google.com https://script.googleusercontent.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src https://fonts.gstatic.com;
    img-src 'self' https://raw.githubusercontent.com;
    frame-src https://www.youtube.com;
    connect-src https://script.google.com https://script.googleusercontent.com;
    object-src 'none';
    base-uri 'none';
    frame-ancestors 'none';
    form-action 'none';
    upgrade-insecure-requests;">

  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy:        #002855; 
      --navy-dark:   #001a3a; 
      --orange:      #F97316;
      --orange-bg:   #FFF7ED; 
      --orange-ring: #FED7AA; 
      --white:       #ffffff;
      --gray-50:     #F8FAFC; 
      --gray-100:    #F1F5F9; 
      --gray-200:    #E2E8F0;
      --gray-400:    #94A3B8; 
      --gray-500:    #64748B; 
      --gray-700:    #334155; 
      --gray-900:    #0F172A;
      --green:       #22C55E; 
      --green-bg:    #F0FDF4; 
      --green-ring:  #BBF7D0; 
      --green-text:  #15803D;
      --red-bg:      #FEF2F2; 
      --red-ring:    #FECACA; 
      --red-text:    #B91C1C;
      --r:           14px; 
      --r-sm:        8px; 
      --r-lg:        22px;
      --shadow:      0 1px 3px rgba(0,0,0,.05), 0 4px 18px rgba(0,0,0,.08);
    }
    
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--white);
      color: var(--navy);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,.45);
      z-index: 60; opacity: 0; pointer-events: none; transition: opacity .28s ease;
    }
    #overlay.on { opacity: 1; pointer-events: all; }

    /* ANIMATED MOVING ORANGE PROGRESS TRACK */
    .sync-loader-container {
      width: 140px; height: 6px; background: var(--gray-100);
      border-radius: 100px; margin: 12px auto 0; position: relative; overflow: hidden;
    }
    .sync-loader-bar {
      position: absolute; top: 0; left: 0; height: 100%; width: 40%;
      background: var(--orange); border-radius: 100px;
      animation: sweepGlow 1.4s infinite ease-in-out;
    }
    @keyframes sweepGlow {
      0% { left: -40%; }
      100% { left: 100%; }
    }

    #vaultModal {
      position: fixed; inset: 0; background: rgba(15,23,42,.65);
      z-index: 90; display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; pointer-events: none; transition: opacity .2s ease;
    }
    #vaultModal.on { opacity: 1; pointer-events: all; }
    .vault-box-modal {
      background: var(--white); border-radius: var(--r-lg); padding: 32px 24px;
      max-width: 400px; width: 100%; box-shadow: var(--shadow); position: relative;
      transform: translateY(10px); transition: transform .3s ease;
    }
    #vaultModal.on .vault-box-modal { transform: translateY(0); }
    .vault-close {
      position: absolute; top: 16px; right: 16px; background: none; border: none;
      font-size: 20px; color: var(--gray-400); cursor: pointer; line-height: 1;
    }
    .vault-close:hover { color: var(--navy); }
    .vault-label {
      display: block; font-family: 'DM Sans', sans-serif; font-size: 18px;
      font-weight: 700; color: var(--navy); margin-bottom: 8px; text-align: center;
    }
    .vault-sub { font-size: 13px; color: var(--gray-500); line-height: 1.4; margin-bottom: 20px; text-align: center; }
    .vault-field {
      width: 100%; padding: 13px 16px; margin-bottom: 12px; background: var(--gray-50);
      border: 1px solid var(--gray-200); border-radius: var(--r); font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 500; color: var(--navy); outline: none; transition: border-color .15s;
    }
    .vault-field:focus { border-color: var(--orange); background: var(--white); }
    .vault-status {
      margin-top: 14px; padding: 12px; font-size: 12px; font-weight: 500;
      border-radius: var(--r-sm); line-height: 1.4; text-align: center;
    }
    .vs-success { background: var(--green-bg); border: 1px solid var(--green-ring); color: var(--green-text); }
    .vs-error   { background: var(--red-bg); border: 1px solid var(--red-ring); color: var(--red-text); }

    #menuDrawer {
      position: fixed; top: 0; left: 0; height: 100%; width: 310px; background: var(--white);
      z-index: 70; transform: translateX(-100%); transition: transform .32s cubic-bezier(.4,0,.2,1);
      display: flex; flex-direction: column; border-right: 1px solid var(--gray-200);
    }
    #menuDrawer.open { transform: translateX(0); }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 26px 26px 22px; border-bottom: 1px solid var(--gray-100); }
    .drawer-label { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--orange); }
    .close-btn { background: none; border: none; cursor: pointer; color: var(--gray-400); font-size: 18px; padding: 4px 6px; border-radius: 6px; line-height: 1; transition: color .15s; }
    .close-btn:hover { color: var(--navy); }
    .drawer-scroll { flex: 1; overflow-y: auto; padding: 16px 26px 12px; }
    details { margin-bottom: 4px; }
    details summary {
      list-style: none; display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--gray-100);
      font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--gray-900); cursor: pointer; transition: color .15s;
    }
    details summary::-webkit-details-marker { display: none; }
    details[open] summary { color: var(--orange); }
    details summary .chev { color: var(--orange); font-size: 10px; transition: transform .2s; }
    details[open] summary .chev { transform: rotate(180deg); }
    .arc-nav { padding: 8px 0 8px 14px; border-left: 2px solid var(--orange-ring); }
    .arc-link {
      display: block; font-size: 11px; font-weight: 600; text-decoration: none; color: var(--gray-700); letter-spacing: .05em; text-transform: uppercase;
      padding: 6px 0; border-bottom: 1px solid var(--gray-100); transition: color .12s; cursor: pointer;
    }
    .arc-link:last-child { border-bottom: none; }
    .arc-link:hover { color: var(--orange); }
    .arc-empty { font-size: 11px; color: var(--gray-400); font-style: italic; padding: 8px 0; }

    .drawer-foot { padding: 18px 26px 24px; border-top: 1px solid var(--gray-100); display: flex; flex-direction: column; gap: 12px; }
    .support-card { background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: var(--r); padding: 14px 18px; }
    .support-tag { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--orange); margin-bottom: 5px; }
    .support-name { font-size: 14px; font-weight: 600; color: var(--navy); margin-bottom: 3px; }
    .support-email { font-size: 12px; font-weight: 500; color: var(--gray-700); text-decoration: none; }
    .support-email:hover { color: var(--orange); }
    
    /* PUBLIC DIRECT LEGAL LINKS BLOCK */
    .unlocked-legal-links { display: flex; justify-content: space-between; padding: 0 4px; }
    .unlocked-legal-links a { font-size: 11px; font-weight: 600; color: var(--gray-500); text-decoration: none; text-transform: uppercase; letter-spacing: .05em; }
    .unlocked-legal-links a:hover { color: var(--orange); }

    header { position: sticky; top: 0; z-index: 50; background: var(--white); border-bottom: 1px solid var(--gray-100); }
    .hdr-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 66px; display: flex; justify-content: space-between; align-items: center; }
    .hdr-left { display: flex; align-items: center; gap: 18px; }
    
    /* BURGER BAR SYMMETRIC METRICS */
    .burger { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 6px; }
    .burger span { display: block; height: 3px; border-radius: 3px; }
    .b1, .b4 { width: 28px; background: #D2B48C; }
    .b2 { width: 28px; background: #22C55E; } 
    .b3 { width: 28px; background: #5C4033; }
    
    .logo { height: 22px; width: auto; }
    .pill {
      display: flex; align-items: center; gap: 8px; padding: 7px 15px; background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 100px;
      font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gray-400);
    }
    .dot { width: 7px; height: 7px; background: var(--green); border-radius: 50%; animation: pulse 2.2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

    main { max-width: 840px; margin: 0 auto; padding: 44px 20px 80px; }
    
    /* RE-ENGINEERED NON-ITALIC ROUNDED GEOMETRIC TYPOGRAPHY SYSTEM */
    .mod-title {
      font-family: 'DM Sans', sans-serif; 
      font-size: clamp(38px, 6.5vw, 56px);
      font-weight: 800; 
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--navy); 
      text-align: center; 
      margin-bottom: 24px;
    }
    
    .vid-wrap { background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 26px; padding: 10px; margin-bottom: 44px; box-shadow: var(--shadow); }
    .vid-inner { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 18px; background: #000; }
    .vid-inner iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    .card { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--r-lg); padding: 36px 32px; box-shadow: var(--shadow); }
    .loading-txt { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: var(--gray-500); text-align: center; }
    .lang-title { font-family: 'DM Sans', sans-serif; font-size: 20px; font-weight: 700; color: var(--navy); text-align: center; margin-bottom: 24px; }
    .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn {
      display: block; width: 100%; padding: 17px 22px; border: none; border-radius: var(--r);
      font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; cursor: pointer; transition: all .18s; text-align: center;
    }
    .btn-primary { background: var(--navy); color: var(--white); }
    .btn-primary:hover:not(:disabled) { background: var(--orange); }
    .btn-secondary { background: var(--gray-100); color: var(--gray-500); }
    .btn-secondary:hover:not(:disabled) { background: var(--gray-200); }

    .dl-btn {
      display: block; width: 100%; padding: 18px; background: var(--orange-bg); color: var(--orange); border: 2px solid var(--orange-ring); border-radius: var(--r);
      text-align: center; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 24px; transition: all .18s;
    }
    .dl-btn:hover { background: var(--orange); color: var(--white); border-color: var(--orange); }

    .field-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .field {
      width: 100%; padding: 13px 17px; background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: var(--r);
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; color: var(--navy); outline: none; transition: border-color .15s, background .15s;
    }
    .field:focus { border-color: var(--orange); background: var(--white); }
    .field::placeholder { color: var(--gray-400); }

    .ack-row { display: flex; align-items: flex-start; gap: 12px; background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: var(--r); padding: 14px 16px; margin-bottom: 14px; }
    .ack-row input[type="checkbox"] { width: 17px; height: 17px; flex-shrink: 0; accent-color: var(--orange); margin-top: 2px; cursor: pointer; }
    #ack-label { font-size: 12px; font-weight: 500; color: var(--gray-500); line-height: 1.55; cursor: pointer; }

    .quiz-badge { display: inline-block; padding: 3px 12px; background: var(--gray-100); color: var(--navy); border-radius: 100px;
      font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 18px; }
    .quiz-q { font-family: 'DM Sans', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.3; color: var(--navy); margin-bottom: 22px; }
    .options { display: flex; flex-direction: column; gap: 9px; }
    .opt-btn {
      width: 100%; text-align: left; background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--r); padding: 14px 18px;
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; color: var(--gray-700); cursor: pointer; transition: border-color .12s, color .12s, background .12s;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--navy); color: var(--navy); background: var(--gray-50); }
    .opt-btn:disabled { cursor: default; }

    .feedback { margin-top: 18px; border-radius: var(--r); padding: 18px 22px; animation: up .28s ease; }
    @keyframes up { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
    .fb-correct { background: var(--green-bg); border: 1px solid var(--green-ring); }
    .fb-wrong   { background: var(--red-bg);   border: 1px solid var(--red-ring); }
    .fb-tag { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; margin-bottom: 5px; }
    .fc { color: var(--green-text); } .fw { color: var(--red-text); }
    .fb-txt { font-size: 13px; font-weight: 500; color: var(--gray-500); line-height: 1.5; margin-bottom: 14px; }

    .done-wrap { text-align: center; padding: 44px 0; }
    .done-title { font-family: 'DM Sans', sans-serif; font-size: 54px; font-weight: 800; color: var(--navy); line-height: 1; margin-bottom: 12px; }
    .done-sub { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .35em; text-transform: uppercase; color: var(--gray-400); }

    .hidden { display: none !important; }
    .tc { text-align: center; }
    .err-msg { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; color: var(--red-text); text-align: center; }

    @media (max-width: 560px) {
      .pill { display: none; }
      .card { padding: 24px 18px; }
      .lang-grid { grid-template-columns: 1fr; }
      #menuDrawer { width: 286px; }
    }
  </style>
</head>
<body>

  <div id="overlay"></div>

  <div id="vaultModal" role="dialog" aria-modal="true">
    <div class="vault-box-modal">
      <button id="close-vault-btn" class="vault-close" aria-label="Close">✕</button>
      <span class="vault-label">Secure Document Vault</span>
      <p id="vaultDocTitle" class="vault-sub">Request encrypted protocol access.</p>

      <input type="hidden" id="vaultActiveDocId">
      <input type="tel" id="vaultPhone" class="vault-field" placeholder="Mobile Number (562) 555-0199" autocomplete="tel">

      <button type="button" id="submitVaultBtn" class="btn btn-primary" style="padding: 14px; font-size: 14px;">Dispatch Secure Link</button>
