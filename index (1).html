<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chargie Field Ops // Safety Hub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy:        #002855;
      --navy-dark:   #001a3a;
      --orange:      #F97316;
      --orange-bg:   #FFF7ED;
      --orange-ring: #FED7AA;
      --white:       #ffffff;
      --gray-50:     #F8FAFC;
      --gray-100:    #F1F5F9;
      --gray-200:    #E2E8F0;
      --gray-400:    #94A3B8;
      --gray-500:    #64748B;
      --gray-700:    #334155;
      --gray-900:    #0F172A;
      --green:       #22C55E;
      --green-bg:    #F0FDF4;
      --green-ring:  #BBF7D0;
      --green-text:  #15803D;
      --red-bg:      #FEF2F2;
      --red-ring:    #FECACA;
      --red-text:    #B91C1C;
      --r:           14px;
      --r-sm:        8px;
      --r-lg:        22px;
      --shadow:      0 1px 3px rgba(0,0,0,.05), 0 4px 18px rgba(0,0,0,.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--white);
      color: var(--navy);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── OVERLAY ── */
    #overlay {
      position: fixed; inset: 0;
      background: rgba(15,23,42,.45);
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity .28s ease;
    }
    #overlay.on { opacity: 1; pointer-events: all; }

    /* ── DRAWER ── */
    #menuDrawer {
      position: fixed;
      top: 0; left: 0;
      height: 100%; width: 310px;
      background: var(--white);
      z-index: 70;
      transform: translateX(-100%);
      transition: transform .32s cubic-bezier(.4,0,.2,1);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--gray-200);
    }
    #menuDrawer.open { transform: translateX(0); }

    .drawer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 26px 26px 22px;
      border-bottom: 1px solid var(--gray-100);
    }
    .drawer-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px; font-weight: 800; font-style: italic;
      letter-spacing: .18em; text-transform: uppercase;
      color: var(--orange);
    }
    .close-btn {
      background: none; border: none; cursor: pointer;
      color: var(--gray-400); font-size: 18px;
      padding: 4px 6px; border-radius: 6px;
      line-height: 1; transition: color .15s;
    }
    .close-btn:hover { color: var(--navy); }

    .drawer-scroll { flex: 1; overflow-y: auto; padding: 16px 26px 12px; }

    details { margin-bottom: 4px; }
    details summary {
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid var(--gray-100);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px; font-weight: 800; font-style: italic;
      letter-spacing: .22em; text-transform: uppercase;
      color: var(--gray-900);
      cursor: pointer;
      transition: color .15s;
    }
    details summary::-webkit-details-marker { display: none; }
    details[open] summary { color: var(--orange); }
    details summary .chev {
      color: var(--orange); font-size: 10px;
      transition: transform .2s;
    }
    details[open] summary .chev { transform: rotate(180deg); }

    .arc-nav {
      padding: 8px 0 8px 14px;
      border-left: 2px solid var(--orange-ring);
    }
    .arc-link {
      display: block;
      font-size: 11px; font-weight: 600;
      text-decoration: none;
      color: var(--gray-700);
      letter-spacing: .05em;
      text-transform: uppercase;
      padding: 6px 0;
      border-bottom: 1px solid var(--gray-100);
      transition: color .12s;
    }
    .arc-link:last-child { border-bottom: none; }
    .arc-link:hover { color: var(--orange); }
    .arc-empty {
      font-size: 11px; color: var(--gray-400);
      font-style: italic; padding: 8px 0;
    }

    .drawer-foot {
      padding: 18px 26px 24px;
      border-top: 1px solid var(--gray-100);
    }
    .support-card {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--r);
      padding: 14px 18px;
    }
    .support-tag {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px; font-weight: 800; font-style: italic;
      letter-spacing: .2em; text-transform: uppercase;
      color: var(--orange); margin-bottom: 5px;
    }
    .support-name {
      font-size: 14px; font-weight: 600;
      color: var(--navy); margin-bottom: 3px;
    }
    .support-email {
      font-size: 12px; font-weight: 500;
      color: var(--gray-700); text-decoration: none;
    }
    .support-email:hover { color: var(--orange); }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 50;
      background: var(--white);
      border-bottom: 1px solid var(--gray-100);
    }
    .hdr-inner {
      max-width: 1100px; margin: 0 auto;
      padding: 0 20px; height: 66px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hdr-left { display: flex; align-items: center; gap: 18px; }

    .burger {
      background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column; gap: 4px; padding: 6px;
    }
    .burger span { display: block; height: 3px; border-radius: 3px; }
    .b1, .b4 { width: 28px; background: #D2B48C; }
    .b2 { width: 20px; background: #22C55E; height: 2px; }
    .b3 { width: 28px; background: #5C4033; }

    .logo { height: 22px; width: auto; }

    .pill {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 15px;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 100px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px; font-weight: 700; font-style: italic;
      letter-spacing: .14em; text-transform: uppercase;
      color: var(--gray-400);
    }
    .dot {
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2.2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: .35; }
    }

    /* ── MAIN ── */
    main {
      max-width: 840px; margin: 0 auto;
      padding: 44px 20px 80px;
    }

    .mod-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(52px, 11vw, 92px);
      font-weight: 800; font-style: italic;
      letter-spacing: -.01em; line-height: .92;
      text-transform: uppercase;
      color: var(--navy);
      text-align: center;
      margin-bottom: 28px;
    }

    /* ── VIDEO ── */
    .vid-wrap {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 26px;
      padding: 10px;
      margin-bottom: 44px;
      box-shadow: var(--shadow);
    }
    .vid-inner {
      position: relative;
      padding-bottom: 56.25%; height: 0;
      overflow: hidden; border-radius: 18px;
      background: #000;
    }
    .vid-inner iframe {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; border: 0;
    }

    /* ── CARDS ── */
    .card {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--r-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow);
    }

    /* ── LANGUAGE SCREEN ── */
    .loading-txt {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px; font-weight: 700; font-style: italic;
      letter-spacing: .3em; text-transform: uppercase;
      color: var(--gray-400);
      animation: blink 1.5s infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

    .lang-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px; font-weight: 800; font-style: italic;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--navy); text-align: center;
      margin-bottom: 24px;
    }
    .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* ── BUTTONS ── */
    .btn {
      display: block; width: 100%;
      padding: 17px 22px;
      border: none; border-radius: var(--r);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px; font-weight: 800; font-style: italic;
      letter-spacing: .15em; text-transform: uppercase;
      cursor: pointer; transition: all .18s;
      text-align: center;
    }
    .btn-primary { background: var(--navy); color: var(--white); }
    .btn-primary:hover { background: var(--orange); }
    .btn-secondary { background: var(--gray-100); color: var(--gray-500); }
    .btn-secondary:hover { background: var(--gray-200); }

    .dl-btn {
      display: block; width: 100%;
      padding: 18px;
      background: var(--orange-bg);
      color: var(--orange);
      border: 2px solid var(--orange-ring);
      border-radius: var(--r);
      text-align: center;
      text-decoration: none;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px; font-weight: 800; font-style: italic;
      letter-spacing: .2em; text-transform: uppercase;
      margin-bottom: 24px;
      transition: all .18s;
    }
    .dl-btn:hover { background: var(--orange); color: var(--white); border-color: var(--orange); }

    /* ── FORM ── */
    .field-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .field {
      width: 100%; padding: 13px 17px;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--r);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 500;
      color: var(--navy); outline: none;
      transition: border-color .15s, background .15s;
    }
    .field:focus { border-color: var(--orange); background: var(--white); }
    .field::placeholder { color: var(--gray-400); }

    .ack-row {
      display: flex; align-items: flex-start; gap: 12px;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--r);
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .ack-row input[type="checkbox"] {
      width: 17px; height: 17px; flex-shrink: 0;
      accent-color: var(--orange); margin-top: 2px;
      cursor: pointer;
    }
    #ack-label {
      font-size: 12px; font-weight: 500;
      color: var(--gray-500); line-height: 1.55;
      cursor: pointer;
    }

    /* ── QUIZ ── */
    .quiz-badge {
      display: inline-block;
      padding: 3px 12px;
      background: var(--gray-100);
      color: var(--navy);
      border-radius: 100px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px; font-weight: 800; font-style: italic;
      letter-spacing: .2em; text-transform: uppercase;
      margin-bottom: 18px;
    }
    .quiz-q {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 24px; font-weight: 700;
      line-height: 1.25; color: var(--navy);
      margin-bottom: 22px;
    }
    .options { display: flex; flex-direction: column; gap: 9px; }
    .opt-btn {
      width: 100%; text-align: left;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--r);
      padding: 14px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 500;
      color: var(--gray-700);
      cursor: pointer;
      transition: border-color .12s, color .12s, background .12s;
    }
    .opt-btn:hover:not(:disabled) {
      border-color: var(--navy);
      color: var(--navy);
      background: var(--gray-50);
    }
    .opt-btn:disabled { cursor: default; }

    .feedback {
      margin-top: 18px;
      border-radius: var(--r);
      padding: 18px 22px;
      animation: up .28s ease;
    }
    @keyframes up {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fb-correct { background: var(--green-bg); border: 1px solid var(--green-ring); }
    .fb-wrong   { background: var(--red-bg);   border: 1px solid var(--red-ring); }
    .fb-tag {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px; font-weight: 800; font-style: italic;
      letter-spacing: .22em; text-transform: uppercase;
      margin-bottom: 5px;
    }
    .fc { color: var(--green-text); }
    .fw { color: var(--red-text); }
    .fb-txt {
      font-size: 13px; font-weight: 500;
      color: var(--gray-500); line-height: 1.5;
      margin-bottom: 14px;
    }

    /* ── COMPLETE ── */
    .done-wrap { text-align: center; padding: 44px 0; }
    .done-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 80px; font-weight: 800; font-style: italic;
      text-transform: uppercase; color: var(--navy);
      line-height: 1; margin-bottom: 10px;
    }
    .done-sub {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px; font-weight: 700; font-style: italic;
      letter-spacing: .35em; text-transform: uppercase;
      color: var(--gray-400);
    }

    /* ── UTILS ── */
    .hidden { display: none !important; }
    .tc { text-align: center; }

    /* ── ERROR STATE ── */
    .err-msg {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px; font-weight: 700; font-style: italic;
      letter-spacing: .15em; text-transform: uppercase;
      color: var(--red-text);
    }

    @media (max-width: 560px) {
      .pill { display: none; }
      .card { padding: 24px 18px; }
      .lang-grid { grid-template-columns: 1fr; }
      #menuDrawer { width: 286px; }
    }
  </style>
</head>
<body>

<div id="overlay" onclick="toggleMenu()"></div>

<!-- ── DRAWER ── -->
<div id="menuDrawer" role="dialog" aria-modal="true" aria-label="Archive Library">

  <div class="drawer-head">
    <span class="drawer-label">// Archive Library</span>
    <button class="close-btn" onclick="toggleMenu()" aria-label="Close">✕</button>
  </div>

  <div class="drawer-scroll">
    <details open>
      <summary>Job Site Safety <span class="chev">▾</span></summary>
      <div class="arc-nav" id="archive-JobSite">
        <span class="arc-empty">Loading…</span>
      </div>
    </details>
    <details>
      <summary>Driver Safety <span class="chev">▾</span></summary>
      <div class="arc-nav" id="archive-Driver">
        <span class="arc-empty">Loading…</span>
      </div>
    </details>
    <details>
      <summary>Safety Docs <span class="chev">▾</span></summary>
      <div class="arc-nav" id="archive-Doc">
        <span class="arc-empty">Loading…</span>
      </div>
    </details>
  </div>

  <div class="drawer-foot">
    <div class="support-card">
      <div class="support-tag">// Support</div>
      <div class="support-name">Manny Aguilar</div>
      <a href="mailto:maguilar@chargie.com" class="support-email">✉ maguilar@chargie.com</a>
    </div>
  </div>

</div>

<!-- ── HEADER ── -->
<header>
  <div class="hdr-inner">
    <div class="hdr-left">
      <button class="burger" onclick="toggleMenu()" aria-label="Open menu" aria-expanded="false">
        <span class="b1"></span>
        <span class="b2"></span>
        <span class="b3"></span>
        <span class="b4"></span>
      </button>
      <img
        src="https://raw.githubusercontent.com/manfredoaguilar-cpu/Safety/main/Chargie%20Logo%201.png"
        alt="Chargie" class="logo"
        loading="eager">
    </div>
    <div class="pill" id="user-status">
      <span class="dot"></span>
      <span id="display-name">Portal Active</span>
    </div>
  </div>
</header>

<!-- ── MAIN ── -->
<main>

  <h1 id="moduleTitle" class="mod-title">Syncing…</h1>

  <div class="vid-wrap" id="video-wrapper">
    <div class="vid-inner">
      <iframe
        id="heroVideo"
        src=""
        title="Safety module video"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <div style="max-width:560px; margin:0 auto;">

    <!-- Language select -->
    <div class="card tc" id="language-screen">
      <div id="lang-loading" class="loading-txt">Establishing Protocol…</div>
      <div id="lang-buttons" class="hidden">
        <div class="lang-title">Select Language</div>
        <div class="lang-grid">
          <button class="btn btn-primary" onclick="setLanguage('en')">English</button>
          <button class="btn btn-primary" onclick="setLanguage('es')">Español</button>
        </div>
      </div>
    </div>

    <!-- Start / sign-in -->
    <div class="card hidden" id="start-screen">
      <a id="download-btn" href="#" target="_blank" rel="noopener" class="dl-btn">
        ↓ Download PDF Document
      </a>
      <div id="pii-fields" class="field-group">
        <input type="text"  id="userName"  class="field" placeholder="Full Name"      autocomplete="name">
        <input type="email" id="userEmail" class="field" placeholder="Email Address"  autocomplete="email">
      </div>
      <div class="ack-row">
        <input type="checkbox" id="ack-checkbox">
        <label id="ack-label" for="ack-checkbox">I confirm I have reviewed this document.</label>
      </div>
      <button class="btn btn-primary" id="start-btn" onclick="handleStart()">Begin Evaluation</button>
    </div>

    <!-- Quiz -->
    <div class="card hidden" id="quiz-container"></div>

  </div>
</main>

<script>
  const SCRIPT = 'https://script.google.com/macros/s/AKfycbywOpDILOSwSMAltFYXTuEpn9qtVGDcBhG2aVEKrCuMLn58cdwZ_4mmm2D11sSqk7SJIw/exec';

  /* ── TOKEN: capture ?id= param and scrub it from the URL ── */
  const urlP = new URLSearchParams(window.location.search);
  if (urlP.has('id')) {
    sessionStorage.setItem('uuid', urlP.get('id'));
    const clean = urlP.has('module') ? '?module=' + urlP.get('module') : '';
    window.history.replaceState({}, '', window.location.pathname + clean);
  }

  let quizData = [], currentLang = 'en', modTitle = '', modCategory = '';

  const copy = {
    en: { start: 'Begin Evaluation', doc: 'Confirm Receipt',
          ack: 'I confirm I have reviewed this document.' },
    es: { start: 'Iniciar Evaluación', doc: 'Confirmar Recibo',
          ack: 'Confirmo que he revisado este documento.' }
  };

  /* ── DRAWER ── */
  function toggleMenu() {
    const drawer = document.getElementById('menuDrawer');
    const overlay = document.getElementById('overlay');
    const burger  = document.querySelector('.burger');
    const isOpen  = drawer.classList.toggle('open');
    overlay.classList.toggle('on', isOpen);
    burger.setAttribute('aria-expanded', isOpen);
  }

  /* ── LANGUAGE ── */
  function setLanguage(lang) {
    currentLang = lang;
    document.getElementById('language-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');

    const dlBtn = document.getElementById('download-btn');
    dlBtn.href = lang === 'en' ? (window.guideEN || '#') : (window.guideES || '#');

    document.getElementById('ack-label').textContent = copy[lang].ack;
    document.getElementById('start-btn').textContent =
      modCategory === 'Doc' ? copy[lang].doc : copy[lang].start;

    quizData = lang === 'en' ? (window.quizEN || []) : (window.quizES || []);

    /* Hide PII inputs if user arrived via tracked link */
    if (sessionStorage.getItem('uuid')) {
      document.getElementById('pii-fields').classList.add('hidden');
    }
  }

  /* ── START ── */
  function handleStart() {
    const uuid  = sessionStorage.getItem('uuid');
    const name  = document.getElementById('userName').value.trim();
    const email = document.getElementById('userEmail').value.trim();

    if (!uuid && (!name || !email)) {
      alert('Please enter your full name and email to continue.');
      return;
    }
    if (!document.getElementById('ack-checkbox').checked) {
      alert('Please check the acknowledgement box to continue.');
      return;
    }

    if (modCategory === 'Doc') { recordComplete(); return; }

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('quiz-container').classList.remove('hidden');
    renderQuestion(0);
  }

  /* ── QUIZ ── */
  function renderQuestion(idx) {
    const q   = quizData[idx];
    const box = document.getElementById('quiz-container');

    box.innerHTML = `
      <div class="quiz-badge">Step ${idx + 1} / ${quizData.length}</div>
      <div class="quiz-q">${escHtml(q.q)}</div>
      <div class="options" id="opts">
        ${q.a.map((opt, i) => `
          <button class="opt-btn" onclick="checkAnswer(${idx},${i})">
            ${escHtml(opt)}
          </button>`).join('')}
      </div>
      <div id="fb"></div>`;
  }

  function checkAnswer(qIdx, oIdx) {
    const q = quizData[qIdx];
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);

    const isRight = oIdx === q.correct;
    const fb = document.getElementById('fb');

    if (isRight) {
      const last = qIdx >= quizData.length - 1;
      fb.innerHTML = `
        <div class="feedback fb-correct">
          <div class="fb-tag fc">// Correct</div>
          <div class="fb-txt">${escHtml(q.f)}</div>
          <button class="btn btn-primary"
            onclick="${last ? 'recordComplete()' : `renderQuestion(${qIdx + 1})`}">
            ${last ? 'Finalize Sync' : 'Next Challenge'}
          </button>
        </div>`;
    } else {
      fb.innerHTML = `
        <div class="feedback fb-wrong">
          <div class="fb-tag fw">// Retry</div>
          <div class="fb-txt">${escHtml(q.f)}</div>
          <button class="btn btn-secondary" onclick="renderQuestion(${qIdx})">Try Again</button>
        </div>`;
    }
  }

  /* ── COMPLETE ── */
  function recordComplete() {
    const name  = document.getElementById('userName')?.value  || '';
    const email = document.getElementById('userEmail')?.value || '';
    const uuid  = sessionStorage.getItem('uuid') || '';

    /* Show completion UI immediately */
    document.getElementById('start-screen').classList.add('hidden');
    const box = document.getElementById('quiz-container');
    box.classList.remove('hidden');
    box.innerHTML = `
      <div class="done-wrap">
        <div class="done-title">Verified</div>
        <div class="done-sub">Field Ops Compliance Sync Complete</div>
      </div>`;

    /* Fire-and-forget completion log */
    fetch(`${SCRIPT}?action=logCompletion` +
      `&uuid=${encodeURIComponent(uuid)}` +
      `&name=${encodeURIComponent(name)}` +
      `&email=${encodeURIComponent(email)}` +
      `&lang=${currentLang}` +
      `&modTitle=${encodeURIComponent(modTitle)}`)
    .catch(() => {/* silent — log may retry later */});
  }

  /* ── HELPERS ── */
  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── LOAD MODULE ── */
  const modID = new URLSearchParams(window.location.search).get('module') || '';

  fetch(`${SCRIPT}?action=getModule&moduleId=${encodeURIComponent(modID)}`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => {
      document.getElementById('moduleTitle').textContent = d.topic || 'Safety Module';
      modTitle    = d.topic    || '';
      modCategory = d.category || '';

      if (d.category === 'Doc') {
        document.getElementById('video-wrapper').style.display = 'none';
      } else {
        document.getElementById('heroVideo').src =
          `https://www.youtube.com/embed/${d.videoId}?rel=0`;
      }

      window.guideEN = d.guideEN || '#';
      window.guideES = d.guideES || '#';
      window.quizEN  = d.quizEN  || [];
      window.quizES  = d.quizES  || [];

      document.getElementById('lang-loading').classList.add('hidden');
      document.getElementById('lang-buttons').classList.remove('hidden');
    })
    .catch(() => {
      document.getElementById('lang-loading').className = 'err-msg';
      document.getElementById('lang-loading').textContent =
        'Could not load module — check your connection and refresh.';
    });

  /* ── LOAD ARCHIVE ── */
  fetch(`${SCRIPT}?action=getArchive`)
    .then(r => r.json())
    .then(data => {
      /* Clear loading placeholders */
      ['JobSite','Driver','Doc'].forEach(cat => {
        document.getElementById(`archive-${cat}`).innerHTML = '';
      });

      data.forEach(m => {
        const key = m.category ? m.category.replace(/\s+/g,'') : '';
        const nav = document.getElementById(`archive-${key}`);
        if (!nav) return;
        const a = document.createElement('a');
        a.href      = `?module=${m.id}`;
        a.className = 'arc-link';
        a.textContent = m.title;
        nav.appendChild(a);
      });

      /* Show empty state for any empty nav */
      ['JobSite','Driver','Doc'].forEach(cat => {
        const nav = document.getElementById(`archive-${cat}`);
        if (nav && !nav.children.length) {
          nav.innerHTML = '<span class="arc-empty">No entries yet.</span>';
        }
      });
    })
    .catch(() => {
      ['JobSite','Driver','Doc'].forEach(cat => {
        const nav = document.getElementById(`archive-${cat}`);
        if (nav) nav.innerHTML = '<span class="arc-empty">Could not load.</span>';
      });
    });
</script>
</body>
</html>
