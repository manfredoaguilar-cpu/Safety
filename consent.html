<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chargie // Employee Communications Consent</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      background: #F8FAFC;
      color: #002855;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .consent-card {
      background: #ffffff;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 4px 18px rgba(0,0,0,.04);
    }
    .logo { height: 24px; margin-bottom: 24px; }
    h2 { margin: 0 0 16px; font-size: 20px; font-weight: 600; }
    p { font-size: 14px; color: #64748B; line-height: 1.5; margin-bottom: 24px; }
    
    .field-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    input[type="tel"] {
      width: 100%; padding: 12px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      font-family: inherit; font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    input[type="tel"]:focus { border-color: #F97316; }
    
    .checkbox-row {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 0;
    }
    input[type="checkbox"] { margin-top: 3px; accent-color: #F97316; width: 16px; height: 16px; cursor: pointer; }
    .legal-text { font-size: 13px; color: #64748B; line-height: 1.5; }
    .legal-text a { color: #F97316; text-decoration: none; font-weight: 500; }
    .legal-text a:hover { text-decoration: underline; }
    
    .btn {
      width: 100%; padding: 14px;
      background: #002855; color: white;
      border: none; border-radius: 8px;
      font-weight: 600; font-size: 14px; cursor: pointer;
      margin-top: 16px; transition: background .15s;
    }
    .btn:hover { background: #F97316; }
  </style>
</head>
<body>

  <div class="consent-card">
    <img src="https://raw.githubusercontent.com/manfredoaguilar-cpu/Safety/main/Chargie%20Logo%201.png" alt="Chargie" class="logo">
    <h2>Field Operations Onboarding</h2>
    <p>Please register your mobile handset connection to synchronize emergency hazard notifications and mandatory training updates.</p>
    
    <div class="field-group">
      <label>Mobile Number (Optional)</label>
      <input type="tel" placeholder="(562) 555-0199">
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="sms-consent">
      <label for="sms-consent" class="legal-text">
        By checking, you are allowing to receive transactional/informational SMS communications regarding safety notifications, team deployment alerts, and training compliance from Chargie LLC[cite: 160]. Message frequency varies based on operational needs[cite: 161]. Message and data rates may apply[cite: 161]. Reply <strong>HELP</strong> for help or <strong>STOP</strong> to opt-out[cite: 161].
      </label>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="tos-consent">
      <label for="tos-consent" class="legal-text">
        By checking, I accept the <a href="https://manfredoaguilar-cpu.github.io/Safety/" target="_blank" rel="noopener noreferrer">Terms of Service</a> & <a href="https://manfredoaguilar-cpu.github.io/Safety/" target="_blank" rel="noopener noreferrer">Privacy Policy</a>[cite: 162].
      </label>
    </div>

    <button type="button" class="btn">Continue</button>
  </div>

</body>
</html>
